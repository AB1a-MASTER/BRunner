<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>BRunner Mapper Inspector</title>
  <link rel="stylesheet" href="../shared/studio-tokens.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="inspector-header">
    <div class="brand">
      <img src="../icons/icon2.png" alt="">
      <div>
        <strong>BRunner</strong>
        <span>Mapper Inspector</span>
      </div>
    </div>
    <div class="header-actions">
      <input id="map-workflow-id" type="text" placeholder="Workflow ID for active-page map">
      <button id="btn-map-active" type="button">Map Active Page</button>
      <button id="btn-refresh" type="button">Refresh</button>
      <label class="toggle">
        <input id="highlight-enabled" type="checkbox" checked>
        Highlight on website
      </label>
    </div>
  </header>

  <main class="inspector-shell">
    <aside class="site-panel" aria-label="Saved map websites">
      <div class="panel-heading">
        <span>Websites</span>
        <input id="site-search" type="search" placeholder="Search maps">
      </div>
      <div id="site-list" class="site-list"></div>
    </aside>

    <section class="map-panel" aria-label="Selected map">
      <div class="map-toolbar">
        <div>
          <h1 id="map-title">No map selected</h1>
          <p id="map-subtitle">Record or map a page to inspect components.</p>
        </div>
        <div class="view-tabs" role="tablist" aria-label="Map views">
          <button class="view-tab active" data-view="tree" type="button">Tree</button>
          <button class="view-tab" data-view="graph" type="button">Graph</button>
        </div>
      </div>

      <div id="view-tree" class="map-view active"></div>
      <div id="view-graph" class="map-view"></div>
    </section>

    <aside class="detail-panel" aria-label="Component details">
      <section>
        <div class="panel-heading compact">
          <span>Policy</span>
        </div>
        <div id="policy-panel" class="policy-panel"></div>
      </section>
      <section>
        <div class="panel-heading compact">
          <span>Review Queue</span>
        </div>
        <div id="review-list" class="review-list"></div>
      </section>
      <section>
        <div class="panel-heading compact">
          <span>Component</span>
        </div>
        <div id="component-detail" class="component-detail empty">
          Select a component.
        </div>
      </section>
    </aside>
  </main>

  <div id="status-line" class="status-line" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>

</html>
